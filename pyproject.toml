[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patent-citation-search"
version = "1.0.0"
description = "A reproducible comparison of UCS and GBFS on SNAP patent citations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy==2.3.5",
    "pandas==2.2.3",
    "matplotlib==3.10.8",
]

[project.scripts]
patent-search = "patent_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
